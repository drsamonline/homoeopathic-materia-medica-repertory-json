<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>404 — Not found | Homoeopathic Materia Medica &amp; Repertory — JSON</title>
<meta name="description" content="That path does not exist in the Homoeopathic Materia Medica &amp; Repertory JSON dataset.">
<meta name="robots" content="noindex, follow">
<meta name="theme-color" content="#0d1117">
<link rel="canonical" href="https://drsamonline.github.io/homoeopathic-materia-medica-repertory-json/">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<style>
  :root{--bg:#0d1117;--panel:#161b22;--border:#21262d;--fg:#e6edf3;--muted:#8b949e;--key:#79c0ff;--str:#7ee787;--num:#ffa657;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--fg);
    font-family:var(--mono);padding:28px;
    background-image:radial-gradient(1000px 500px at 50% -160px,rgba(88,166,255,.10),transparent 70%)}
  .box{max-width:620px;width:100%;background:linear-gradient(180deg,var(--panel),#0f141b);
    border:1px solid var(--border);border-radius:14px;overflow:hidden}
  .bar{display:flex;align-items:center;gap:8px;padding:9px 14px;border-bottom:1px solid var(--border);background:#0f141b}
  .bar i{width:11px;height:11px;border-radius:50%;display:block}
  .bar i:nth-child(1){background:#ff5f57}.bar i:nth-child(2){background:#febc2e}.bar i:nth-child(3){background:#28c840}
  .bar span{margin-left:6px;color:var(--muted);font-size:12.5px}
  .body{padding:26px 24px 30px}
  h1{margin:0 0 8px;font-size:22px}
  .code{color:var(--num)}
  p{color:var(--muted);font-size:13.5px;margin:0 0 20px}
  pre{margin:0 0 20px;background:#010409;border:1px solid var(--border);border-radius:10px;padding:14px;overflow:auto;font-size:12.5px}
  .k{color:var(--key)}.s{color:var(--str)}
  a.btn{display:inline-flex;align-items:center;gap:8px;background:#1f6feb;color:#fff;text-decoration:none;
    border-radius:8px;padding:10px 16px;font-size:13.5px;font-weight:600}
  a.btn:hover{background:#2a7aec}
  a.ghost{color:var(--muted);font-size:12.5px;margin-left:14px;text-decoration:none}
  a.ghost:hover{color:var(--fg)}
</style>
</head>
<body>
  <main class="box">
    <div class="bar"><i></i><i></i><i></i><span>404.json</span></div>
    <div class="body">
      <h1>404 &mdash; <span class="code">path not found</span></h1>
      <p>No file at this path in the dataset.</p>
      <pre>{
  <span class="k">"type"</span>: <span class="s">"error"</span>,
  <span class="k">"status"</span>: 404,
  <span class="k">"message"</span>: <span class="s">"That path is not in this dataset."</span>,
  <span class="k">"hint"</span>: <span class="s">"Repertories live in /repertory/, materia medicas in /materia_medica/."</span>
}</pre>
      <a class="btn" href="https://drsamonline.github.io/homoeopathic-materia-medica-repertory-json/">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5"/><path d="m12 19-7-7 7-7"/></svg>
        Back to the dataset
      </a>
      <a class="ghost" href="https://github.com/drsamonline/homoeopathic-materia-medica-repertory-json">view the repo &#8599;</a>
    </div>
  </main>
</body>
</html>
